spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      service: notification-service
