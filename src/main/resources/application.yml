spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  datasource:
    url: ${ALERTS_DB_URL:jdbc:postgresql://localhost:5432/alerts_db}
    username: ${ALERTS_DB_USER:motorfraude}
    password: ${ALERTS_DB_PASSWORD:motorfraude}

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      service: notification-service
